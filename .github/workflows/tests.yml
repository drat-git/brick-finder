name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check frontend/app.js
      - run: node --check frontend/streamlit.js
      - run: node --check frontend/inventory.js
      - run: node --test tests/test_transport.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - name: Firebase emulator persistence and security rules
        run: npx firebase emulators:exec --only auth,firestore --project demo-rebuilt "node --test tests/test_rules.mjs && python -m unittest tests.test_firebase_emulator -v"
