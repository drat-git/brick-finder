name: Tests
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: Python, transport, and Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Python unit and integration tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: JavaScript syntax checks
        run: |
          node --check frontend/app.js
          node --check frontend/streamlit.js
          node --check frontend/inventory.js
      - name: Streamlit transport tests
        run: node --test tests/test_transport.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - name: Firebase emulator persistence and security rules
        run: npx firebase emulators:exec --only auth,firestore --project demo-rebuilt "node --test tests/test_rules.mjs && python -m unittest tests.test_firebase_emulator -v"
